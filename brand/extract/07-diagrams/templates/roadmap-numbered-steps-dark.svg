<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>KPMG numbered agenda roadmap, 6 steps, on blue</title>
<!-- KPMG 2026 palette: KPMG Blue #00338D, Cobalt #1E49E2, Pacific Blue #00B8F5, Purple #7213EA, Dark Blue #0C233C. All labels are live <text>; edit in Illustrator/Figma/Inkscape, or insert in PowerPoint and use "Convert to Shape". -->
<defs>
  <linearGradient id="bgBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00338D"/><stop offset="1" stop-color="#1E49E2"/></linearGradient>
  <linearGradient id="cardPacific" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8F5"/><stop offset="1" stop-color="#ACEAFF"/></linearGradient>
  <linearGradient id="cobaltPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E49E2"/><stop offset="1" stop-color="#7213EA"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bgBlue)"/>
<g id="content">
<text x="80" y="140" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="80" dy="0.0">Looking ahead: your 2026 agenda</tspan></text>
<g id="step-1">
<text x="80" y="360" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="64" font-weight="bold" fill="#00B8F5" text-anchor="start" ><tspan x="80" dy="0.0">01</tspan></text>
<line x1="80" y1="390" x2="295" y2="390" stroke="#00B8F5" stroke-width="3"/>
<text x="80" y="440" font-family="Arial,'Helvetica Neue',sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="80" dy="0.0">Set the</tspan><tspan x="80" dy="35.0">ambition</tspan></text>
<text x="80" y="530" font-family="Arial,'Helvetica Neue',sans-serif" font-size="21" font-weight="normal" fill="#ACEAFF" text-anchor="start" ><tspan x="80" dy="0.0">Agree where value</tspan><tspan x="80" dy="26.2">will come from</tspan></text>
</g>
<g id="step-2">
<text x="325" y="360" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="64" font-weight="bold" fill="#00B8F5" text-anchor="start" ><tspan x="325" dy="0.0">02</tspan></text>
<line x1="325" y1="390" x2="540" y2="390" stroke="#00B8F5" stroke-width="3"/>
<text x="325" y="440" font-family="Arial,'Helvetica Neue',sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="325" dy="0.0">Fix the</tspan><tspan x="325" dy="35.0">foundations</tspan></text>
<text x="325" y="530" font-family="Arial,'Helvetica Neue',sans-serif" font-size="21" font-weight="normal" fill="#ACEAFF" text-anchor="start" ><tspan x="325" dy="0.0">Data, cloud and</tspan><tspan x="325" dy="26.2">security ready</tspan></text>
</g>
<g id="step-3">
<text x="570" y="360" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="64" font-weight="bold" fill="#00B8F5" text-anchor="start" ><tspan x="570" dy="0.0">03</tspan></text>
<line x1="570" y1="390" x2="785" y2="390" stroke="#00B8F5" stroke-width="3"/>
<text x="570" y="440" font-family="Arial,'Helvetica Neue',sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="570" dy="0.0">Prove value</tspan><tspan x="570" dy="35.0">fast</tspan></text>
<text x="570" y="530" font-family="Arial,'Helvetica Neue',sans-serif" font-size="21" font-weight="normal" fill="#ACEAFF" text-anchor="start" ><tspan x="570" dy="0.0">Pilot and measure</tspan><tspan x="570" dy="26.2">return early</tspan></text>
</g>
<g id="step-4">
<text x="815" y="360" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="64" font-weight="bold" fill="#00B8F5" text-anchor="start" ><tspan x="815" dy="0.0">04</tspan></text>
<line x1="815" y1="390" x2="1030" y2="390" stroke="#00B8F5" stroke-width="3"/>
<text x="815" y="440" font-family="Arial,'Helvetica Neue',sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="815" dy="0.0">Scale what</tspan><tspan x="815" dy="35.0">works</tspan></text>
<text x="815" y="530" font-family="Arial,'Helvetica Neue',sans-serif" font-size="21" font-weight="normal" fill="#ACEAFF" text-anchor="start" ><tspan x="815" dy="0.0">Industrialise the</tspan><tspan x="815" dy="26.2">winning use cases</tspan></text>
</g>
<g id="step-5">
<text x="1060" y="360" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="64" font-weight="bold" fill="#00B8F5" text-anchor="start" ><tspan x="1060" dy="0.0">05</tspan></text>
<line x1="1060" y1="390" x2="1275" y2="390" stroke="#00B8F5" stroke-width="3"/>
<text x="1060" y="440" font-family="Arial,'Helvetica Neue',sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="1060" dy="0.0">Bring people</tspan><tspan x="1060" dy="35.0">along</tspan></text>
<text x="1060" y="530" font-family="Arial,'Helvetica Neue',sans-serif" font-size="21" font-weight="normal" fill="#ACEAFF" text-anchor="start" ><tspan x="1060" dy="0.0">Skills, roles and</tspan><tspan x="1060" dy="26.2">ways of working</tspan></text>
</g>
<g id="step-6">
<text x="1305" y="360" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="64" font-weight="bold" fill="#00B8F5" text-anchor="start" ><tspan x="1305" dy="0.0">06</tspan></text>
<line x1="1305" y1="390" x2="1520" y2="390" stroke="#00B8F5" stroke-width="3"/>
<text x="1305" y="440" font-family="Arial,'Helvetica Neue',sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="1305" dy="0.0">Govern and</tspan><tspan x="1305" dy="35.0">adapt</tspan></text>
<text x="1305" y="530" font-family="Arial,'Helvetica Neue',sans-serif" font-size="21" font-weight="normal" fill="#ACEAFF" text-anchor="start" ><tspan x="1305" dy="0.0">Trust by design,</tspan><tspan x="1305" dy="26.2">review every quarter</tspan></text>
</g>
<rect x="80" y="660" width="1440" height="4" fill="url(#cardPacific)"/>
</g>
</svg>
