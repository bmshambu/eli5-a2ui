<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>KPMG maturity staircase, 5 levels</title>
<!-- KPMG 2026 palette: KPMG Blue #00338D, Cobalt #1E49E2, Pacific Blue #00B8F5, Purple #7213EA, Dark Blue #0C233C. All labels are live <text>; edit in Illustrator/Figma/Inkscape, or insert in PowerPoint and use "Convert to Shape". -->
<defs>
  <linearGradient id="bgBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00338D"/><stop offset="1" stop-color="#1E49E2"/></linearGradient>
  <linearGradient id="cardPacific" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8F5"/><stop offset="1" stop-color="#ACEAFF"/></linearGradient>
  <linearGradient id="cobaltPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E49E2"/><stop offset="1" stop-color="#7213EA"/></linearGradient>
</defs>

<g id="content">
<text x="80" y="120" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="64" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="80" dy="0.0">Tech maturity model</tspan></text><text x="80" y="168" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="normal" fill="#4D4D4D" text-anchor="start" ><tspan x="80" dy="0.0">Five levels, from no active focus to fully scaled</tspan></text>
<g id="level-1"><rect x="80" y="680" width="280" height="140" fill="#D2DBF9"/>
<text x="102" y="744" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="56" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="102" dy="0.0">1</tspan></text><text x="150" y="744" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="150" dy="0.0">Exploring</tspan></text>
<text x="102" y="784" font-family="Arial,'Helvetica Neue',sans-serif" font-size="20" font-weight="normal" fill="#00338D" text-anchor="start" ><tspan x="102" dy="0.0">Aware of the need,</tspan><tspan x="102" dy="25.0">no action yet</tspan></text></g>
<g id="level-2"><rect x="370" y="580" width="280" height="240" fill="#ACEAFF"/>
<text x="392" y="644" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="56" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="392" dy="0.0">2</tspan></text><text x="440" y="644" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="440" dy="0.0">Piloting</tspan></text>
<text x="392" y="684" font-family="Arial,'Helvetica Neue',sans-serif" font-size="20" font-weight="normal" fill="#00338D" text-anchor="start" ><tspan x="392" dy="0.0">Strategy designed,</tspan><tspan x="392" dy="25.0">pilots underway</tspan></text></g>
<g id="level-3"><rect x="660" y="480" width="280" height="340" fill="#00B8F5"/>
<text x="682" y="544" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="682" dy="0.0">3</tspan></text><text x="730" y="544" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="730" dy="0.0">Funding</tspan></text>
<text x="682" y="584" font-family="Arial,'Helvetica Neue',sans-serif" font-size="20" font-weight="normal" fill="#FFFFFF" text-anchor="start" ><tspan x="682" dy="0.0">Strategy funded,</tspan><tspan x="682" dy="25.0">building blocks in place</tspan></text></g>
<g id="level-4"><rect x="950" y="380" width="280" height="440" fill="#1E49E2"/>
<text x="972" y="444" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="972" dy="0.0">4</tspan></text><text x="1020" y="444" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="1020" dy="0.0">Scaling</tspan></text>
<text x="972" y="484" font-family="Arial,'Helvetica Neue',sans-serif" font-size="20" font-weight="normal" fill="#FFFFFF" text-anchor="start" ><tspan x="972" dy="0.0">On track and</tspan><tspan x="972" dy="25.0">scaling up</tspan></text></g>
<g id="level-5"><rect x="1240" y="280" width="280" height="540" fill="#00338D"/>
<text x="1262" y="344" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="1262" dy="0.0">5</tspan></text><text x="1310" y="344" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="1310" dy="0.0">Leading</tspan></text>
<text x="1262" y="384" font-family="Arial,'Helvetica Neue',sans-serif" font-size="20" font-weight="normal" fill="#FFFFFF" text-anchor="start" ><tspan x="1262" dy="0.0">Fully scaled and</tspan><tspan x="1262" dy="25.0">continually evolving</tspan></text></g>
<path d="M140,620 L1440,180" stroke="#7213EA" stroke-width="4" stroke-dasharray="10 8" fill="none"/>
<polygon points="1440,180 1410,180 1436,208" fill="#7213EA"/>
<text x="80" y="866" font-family="Arial,'Helvetica Neue',sans-serif" font-size="20" font-weight="normal" fill="#4D4D4D" text-anchor="start" ><tspan x="80" dy="0.0">Share of organizations at each level can be added under each step</tspan></text>
</g>
</svg>
