<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>KPMG 2x2 prioritisation matrix</title>
<!-- KPMG 2026 palette: KPMG Blue #00338D, Cobalt #1E49E2, Pacific Blue #00B8F5, Purple #7213EA, Dark Blue #0C233C. All labels are live <text>; edit in Illustrator/Figma/Inkscape, or insert in PowerPoint and use "Convert to Shape". -->
<defs>
  <linearGradient id="bgBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00338D"/><stop offset="1" stop-color="#1E49E2"/></linearGradient>
  <linearGradient id="cardPacific" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8F5"/><stop offset="1" stop-color="#ACEAFF"/></linearGradient>
  <linearGradient id="cobaltPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E49E2"/><stop offset="1" stop-color="#7213EA"/></linearGradient>
</defs>

<g id="content">
<text x="80" y="120" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="64" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="80" dy="0.0">Prioritisation matrix</tspan></text><text x="80" y="168" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="normal" fill="#4D4D4D" text-anchor="start" ><tspan x="80" dy="0.0">Value against ease of implementation</tspan></text>
<g id="quick-wins"><rect x="730" y="210" width="300" height="300" fill="#00B8F5"/>
<text x="758" y="280" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="758" dy="0.0">Quick wins</tspan></text><text x="758" y="318" font-family="Arial,'Helvetica Neue',sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start" ><tspan x="758" dy="0.0">Do now</tspan></text></g>
<g id="strategic-bets"><rect x="420" y="210" width="300" height="300" fill="#00338D"/>
<text x="448" y="280" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="448" dy="0.0">Strategic bets</tspan></text><text x="448" y="318" font-family="Arial,'Helvetica Neue',sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="start" ><tspan x="448" dy="0.0">Plan and invest</tspan></text></g>
<g id="fill-ins"><rect x="730" y="520" width="300" height="300" fill="#D2DBF9"/>
<text x="758" y="590" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="758" dy="0.0">Fill-ins</tspan></text><text x="758" y="628" font-family="Arial,'Helvetica Neue',sans-serif" font-size="22" font-weight="normal" fill="#00338D" text-anchor="start" ><tspan x="758" dy="0.0">Do when capacity allows</tspan></text></g>
<g id="deprioritise"><rect x="420" y="520" width="300" height="300" fill="#E9EDFC"/>
<text x="448" y="590" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="448" dy="0.0">Deprioritise</tspan></text><text x="448" y="628" font-family="Arial,'Helvetica Neue',sans-serif" font-size="22" font-weight="normal" fill="#00338D" text-anchor="start" ><tspan x="448" dy="0.0">Revisit next year</tspan></text></g>
<line x1="390" y1="850" x2="1080" y2="850" stroke="#00338D" stroke-width="3"/>
<polygon points="1080,840 1100,850 1080,860" fill="#00338D"/>
<line x1="390" y1="850" x2="390" y2="190" stroke="#00338D" stroke-width="3"/>
<polygon points="380,190 390,170 400,190" fill="#00338D"/>
<text x="720" y="890" font-family="Arial,'Helvetica Neue',sans-serif" font-size="22" font-weight="bold" fill="#00338D" text-anchor="middle" ><tspan x="720" dy="0.0">Ease of implementation</tspan></text>
<text x="360" y="510" font-family="Arial,'Helvetica Neue',sans-serif" font-size="22" font-weight="bold" fill="#00338D" text-anchor="middle" transform="rotate(-90 360 510)"><tspan x="360" dy="0.0">Value</tspan></text>
<circle cx="890" cy="330" r="26" fill="#7213EA"/><text x="890" y="339" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" ><tspan x="890" dy="0.0">A</tspan></text>
<circle cx="580" cy="410" r="26" fill="#7213EA"/><text x="580" y="419" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" ><tspan x="580" dy="0.0">B</tspan></text>
<circle cx="980" cy="750" r="26" fill="#7213EA"/><text x="980" y="759" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle" ><tspan x="980" dy="0.0">C</tspan></text>
<text x="1110" y="300" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="normal" fill="#00338D" text-anchor="start" ><tspan x="1110" dy="0.0">A  AI invoice matching</tspan><tspan x="1110" dy="43.2">B  New ERP platform</tspan><tspan x="1110" dy="43.2">C  Report clean-up</tspan></text>
</g>
</svg>
