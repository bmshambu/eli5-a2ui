<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>KPMG cycle diagram, 4 stages</title>
<!-- KPMG 2026 palette: KPMG Blue #00338D, Cobalt #1E49E2, Pacific Blue #00B8F5, Purple #7213EA, Dark Blue #0C233C. All labels are live <text>; edit in Illustrator/Figma/Inkscape, or insert in PowerPoint and use "Convert to Shape". -->
<defs>
  <linearGradient id="bgBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00338D"/><stop offset="1" stop-color="#1E49E2"/></linearGradient>
  <linearGradient id="cardPacific" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8F5"/><stop offset="1" stop-color="#ACEAFF"/></linearGradient>
  <linearGradient id="cobaltPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E49E2"/><stop offset="1" stop-color="#7213EA"/></linearGradient>
</defs>

<g id="content">
<text x="80" y="120" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="64" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="80" dy="0.0">Continuous improvement cycle</tspan></text><text x="80" y="168" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="normal" fill="#4D4D4D" text-anchor="start" ><tspan x="80" dy="0.0">Four repeating stages</tspan></text>
<path id="segment-1" d="M809.4,270.2 A270,270 0 0 1 1069.8,530.6 L969.9,534.1 A170,170 0 0 0 805.9,370.1 Z" fill="#00338D"/>
<text x="955.5634918610405" y="398.43650813895954" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle" ><tspan x="955.5634918610405" dy="0.0">Plan</tspan></text>
<text x="1040.4163056034263" y="289.58369439657383" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="1040.4163056034263" dy="0.0">Set goals and</tspan><tspan x="1040.4163056034263" dy="30.0">measures</tspan></text>
<path id="segment-2" d="M1069.8,549.4 A270,270 0 0 1 809.4,809.8 L805.9,709.9 A170,170 0 0 0 969.9,545.9 Z" fill="#1E49E2"/>
<text x="955.5634918610405" y="709.5634918610405" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle" ><tspan x="955.5634918610405" dy="0.0">Do</tspan></text>
<text x="1040.4163056034263" y="770.4163056034262" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="bold" fill="#1E49E2" text-anchor="start" ><tspan x="1040.4163056034263" dy="0.0">Run the change</tspan><tspan x="1040.4163056034263" dy="30.0">at small scale</tspan></text>
<path id="segment-3" d="M790.6,809.8 A270,270 0 0 1 530.2,549.4 L630.1,545.9 A170,170 0 0 0 794.1,709.9 Z" fill="#00B8F5"/>
<text x="644.4365081389595" y="709.5634918610405" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle" ><tspan x="644.4365081389595" dy="0.0">Check</tspan></text>
<text x="559.5836943965738" y="770.4163056034262" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="bold" fill="#00B8F5" text-anchor="end" ><tspan x="559.5836943965738" dy="0.0">Review results</tspan><tspan x="559.5836943965738" dy="30.0">against targets</tspan></text>
<path id="segment-4" d="M530.2,530.6 A270,270 0 0 1 790.6,270.2 L794.1,370.1 A170,170 0 0 0 630.1,534.1 Z" fill="#7213EA"/>
<text x="644.4365081389595" y="398.43650813895954" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="bold" fill="#FFFFFF" text-anchor="middle" ><tspan x="644.4365081389595" dy="0.0">Act</tspan></text>
<text x="559.5836943965737" y="289.58369439657383" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="bold" fill="#7213EA" text-anchor="end" ><tspan x="559.5836943965737" dy="0.0">Embed and</tspan><tspan x="559.5836943965737" dy="30.0">standardise</tspan></text>
<circle cx="800" cy="540" r="146" fill="#E9EDFC"/>
<text x="800" y="534" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="52" font-weight="bold" fill="#00338D" text-anchor="middle" ><tspan x="800" dy="0.0">Value</tspan></text><text x="800" y="576" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="normal" fill="#4D4D4D" text-anchor="middle" ><tspan x="800" dy="0.0">for clients</tspan></text>
</g>
