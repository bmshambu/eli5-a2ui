<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>KPMG three gradient cards on blue</title>
<!-- KPMG 2026 palette: KPMG Blue #00338D, Cobalt #1E49E2, Pacific Blue #00B8F5, Purple #7213EA, Dark Blue #0C233C. All labels are live <text>; edit in Illustrator/Figma/Inkscape, or insert in PowerPoint and use "Convert to Shape". -->
<defs>
  <linearGradient id="bgBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00338D"/><stop offset="1" stop-color="#1E49E2"/></linearGradient>
  <linearGradient id="cardPacific" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8F5"/><stop offset="1" stop-color="#ACEAFF"/></linearGradient>
  <linearGradient id="cobaltPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E49E2"/><stop offset="1" stop-color="#7213EA"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bgBlue)"/>
<g id="content">
<text x="80" y="150" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="80" dy="0.0">How to emulate the high performers</tspan></text>
<g id="card-1"><rect x="80" y="260" width="450" height="200" fill="url(#cardPacific)"/>
<text x="106" y="356" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="46" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="106" dy="0.0">Address issues</tspan><tspan x="106" dy="46.0">with tech debt</tspan></text>
<text x="80" y="520" font-family="Arial,'Helvetica Neue',sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="80" dy="0.0">8 percent</tspan></text>
<text x="80" y="560" font-family="Arial,'Helvetica Neue',sans-serif" font-size="21" font-weight="normal" fill="#FFFFFF" text-anchor="start" ><tspan x="80" dy="0.0">of high performers say the cost of fixing tech</tspan><tspan x="80" dy="29.4">debt stops new investment, versus 45 percent</tspan><tspan x="80" dy="29.4">of the rest.</tspan></text>
<line x1="80" y1="680" x2="170" y2="680" stroke="#00B8F5" stroke-width="4"/></g>
<g id="card-2"><rect x="570" y="260" width="450" height="200" fill="url(#cardPacific)"/>
<text x="596" y="356" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="46" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="596" dy="0.0">Innovate and keep</tspan><tspan x="596" dy="46.0">cost discipline</tspan></text>
<text x="570" y="520" font-family="Arial,'Helvetica Neue',sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="570" dy="0.0">6 percent</tspan></text>
<text x="570" y="560" font-family="Arial,'Helvetica Neue',sans-serif" font-size="21" font-weight="normal" fill="#FFFFFF" text-anchor="start" ><tspan x="570" dy="0.0">of high performers often miss chances to invest</tspan><tspan x="570" dy="29.4">in new technology due to cost pressure,</tspan><tspan x="570" dy="29.4">versus 44 percent of the rest.</tspan></text>
<line x1="570" y1="680" x2="660" y2="680" stroke="#00B8F5" stroke-width="4"/></g>
<g id="card-3"><rect x="1060" y="260" width="450" height="200" fill="url(#cardPacific)"/>
<text x="1086" y="356" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="46" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="1086" dy="0.0">Protect core</tspan><tspan x="1086" dy="46.0">investments</tspan></text>
<text x="1060" y="520" font-family="Arial,'Helvetica Neue',sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="1060" dy="0.0">30 percent</tspan></text>
<text x="1060" y="560" font-family="Arial,'Helvetica Neue',sans-serif" font-size="21" font-weight="normal" fill="#FFFFFF" text-anchor="start" ><tspan x="1060" dy="0.0">of high performers compromise on security,</tspan><tspan x="1060" dy="29.4">scalability or data standards to move fast,</tspan><tspan x="1060" dy="29.4">versus 71 percent of the rest.</tspan></text>
<line x1="1060" y1="680" x2="1150" y2="680" stroke="#00B8F5" stroke-width="4"/></g>
</g>
</svg>
