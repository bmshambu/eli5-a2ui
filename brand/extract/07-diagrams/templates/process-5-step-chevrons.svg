<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>KPMG process flow, 5 chevrons</title>
<!-- KPMG 2026 palette: KPMG Blue #00338D, Cobalt #1E49E2, Pacific Blue #00B8F5, Purple #7213EA, Dark Blue #0C233C. All labels are live <text>; edit in Illustrator/Figma/Inkscape, or insert in PowerPoint and use "Convert to Shape". -->
<defs>
  <linearGradient id="bgBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00338D"/><stop offset="1" stop-color="#1E49E2"/></linearGradient>
  <linearGradient id="cardPacific" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00B8F5"/><stop offset="1" stop-color="#ACEAFF"/></linearGradient>
  <linearGradient id="cobaltPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E49E2"/><stop offset="1" stop-color="#7213EA"/></linearGradient>
</defs>

<g id="content">
<text x="80" y="120" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="64" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="80" dy="0.0">Our delivery approach</tspan></text><text x="80" y="168" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="normal" fill="#4D4D4D" text-anchor="start" ><tspan x="80" dy="0.0">Five steps from discovery to value</tspan></text>
<g id="step-1"><polygon points="80,300 356,300 406,385.0 356,470 80,470 80,385.0" fill="#00338D"/>
<text x="102" y="370" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#ACEAFF" text-anchor="start" ><tspan x="102" dy="0.0">01</tspan></text>
<text x="102" y="430" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="102" dy="0.0">Discover</tspan></text></g>
<text x="90" y="540" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="normal" fill="#4D4D4D" text-anchor="start" ><tspan x="90" dy="0.0">Understand the</tspan><tspan x="90" dy="30.0">business and data</tspan></text>
<line x1="90" y1="500" x2="160" y2="500" stroke="#00338D" stroke-width="4"/>
<g id="step-2"><polygon points="370,300 646,300 696,385.0 646,470 370,470 420,385.0" fill="#0E3EB8"/>
<text x="442" y="370" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#ACEAFF" text-anchor="start" ><tspan x="442" dy="0.0">02</tspan></text>
<text x="442" y="430" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="442" dy="0.0">Define</tspan></text></g>
<text x="380" y="540" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="normal" fill="#4D4D4D" text-anchor="start" ><tspan x="380" dy="0.0">Agree scope,</tspan><tspan x="380" dy="30.0">KPIs and owners</tspan></text>
<line x1="380" y1="500" x2="450" y2="500" stroke="#0E3EB8" stroke-width="4"/>
<g id="step-3"><polygon points="660,300 936,300 986,385.0 936,470 660,470 710,385.0" fill="#1E49E2"/>
<text x="732" y="370" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#ACEAFF" text-anchor="start" ><tspan x="732" dy="0.0">03</tspan></text>
<text x="732" y="430" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="732" dy="0.0">Design</tspan></text></g>
<text x="670" y="540" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="normal" fill="#4D4D4D" text-anchor="start" ><tspan x="670" dy="0.0">Shape the solution</tspan><tspan x="670" dy="30.0">with users</tspan></text>
<line x1="670" y1="500" x2="740" y2="500" stroke="#1E49E2" stroke-width="4"/>
<g id="step-4"><polygon points="950,300 1226,300 1276,385.0 1226,470 950,470 1000,385.0" fill="#0D7FEB"/>
<text x="1022" y="370" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="1022" dy="0.0">04</tspan></text>
<text x="1022" y="430" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="1022" dy="0.0">Deliver</tspan></text></g>
<text x="960" y="540" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="normal" fill="#4D4D4D" text-anchor="start" ><tspan x="960" dy="0.0">Build, test and</tspan><tspan x="960" dy="30.0">go live</tspan></text>
<line x1="960" y1="500" x2="1030" y2="500" stroke="#0D7FEB" stroke-width="4"/>
<g id="step-5"><polygon points="1240,300 1516,300 1566,385.0 1516,470 1240,470 1290,385.0" fill="#00B8F5"/>
<text x="1312" y="370" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="1312" dy="0.0">05</tspan></text>
<text x="1312" y="430" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="1312" dy="0.0">Sustain</tspan></text></g>
<text x="1250" y="540" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="normal" fill="#4D4D4D" text-anchor="start" ><tspan x="1250" dy="0.0">Measure benefits</tspan><tspan x="1250" dy="30.0">and improve</tspan></text>
<line x1="1250" y1="500" x2="1320" y2="500" stroke="#00B8F5" stroke-width="4"/>
</g>
</svg>
