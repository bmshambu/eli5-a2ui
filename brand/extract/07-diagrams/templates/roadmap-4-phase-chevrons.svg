<text x="104" y="326" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="104" dy="0.0">Assess</tspan></text></g>
<text x="88" y="400" font-family="Arial,'Helvetica Neue',sans-serif" font-size="22" font-weight="bold" fill="#00338D" text-anchor="start" ><tspan x="88" dy="0.0">Q1–Q2 2026</tspan></text>
<line x1="88" y1="418" x2="160" y2="418" stroke="#00338D" stroke-width="4"/>
<rect x="88" y="452" width="12" height="12" fill="#00338D"/>
<text x="114" y="466" font-family="Arial,'Helvetica Neue',sans-serif" font-size="22" font-weight="normal" fill="#4D4D4D" text-anchor="start" ><tspan x="114" dy="0.0">Current-state review</tspan></text>
<rect x="88" y="504" width="12" height="12" fill="#00338D"/>
<text x="114" y="518" font-family="Arial,'Helvetica Neue',sans-serif" font-size="22" font-weight="normal" fill="#4D4D4D" text-anchor="start" ><tspan x="114" dy="0.0">Stakeholder interviews</tspan></text>
<rect x="88" y="556" width="12" height="12" fill="#00338D"/>
