<text x="1200" y="570" font-family="Arial,'Helvetica Neue',sans-serif" font-size="22" font-weight="normal" fill="#4D4D4D" text-anchor="start" ><tspan x="1200" dy="0.0">Continuous improvement</tspan></text>
<line x1="80" y1="760" x2="1530" y2="760" stroke="#D2DBF9" stroke-width="4"/>
<rect x="286" y="746" width="28" height="28" transform="rotate(45 300 760)" fill="#00338D"/>
<text x="300" y="810" font-family="Arial,'Helvetica Neue',sans-serif" font-size="20" font-weight="bold" fill="#00338D" text-anchor="middle" ><tspan x="300" dy="0.0">Business case</tspan><tspan x="300" dy="25.0">approved</tspan></text>
<rect x="686" y="746" width="28" height="28" transform="rotate(45 700 760)" fill="#00338D"/>
<text x="700" y="810" font-family="Arial,'Helvetica Neue',sans-serif" font-size="20" font-weight="bold" fill="#00338D" text-anchor="middle" ><tspan x="700" dy="0.0">Design</tspan><tspan x="700" dy="25.0">sign-off</tspan></text>
<rect x="1086" y="746" width="28" height="28" transform="rotate(45 1100 760)" fill="#00338D"/>
