<text x="1174" y="400" font-family="Arial,'Helvetica Neue',sans-serif" font-size="22" font-weight="bold" fill="#7213EA" text-anchor="start" ><tspan x="1174" dy="0.0">Q1–Q2 2027</tspan></text>
