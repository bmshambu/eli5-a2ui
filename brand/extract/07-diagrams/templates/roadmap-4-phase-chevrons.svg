<text x="812" y="400" font-family="Arial,'Helvetica Neue',sans-serif" font-size="22" font-weight="bold" fill="#00B8F5" text-anchor="start" ><tspan x="812" dy="0.0">Q3 2026–Q1 2027</tspan></text>
