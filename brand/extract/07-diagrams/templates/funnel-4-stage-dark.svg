  <linearGradient id="cobaltPurple" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1E49E2"/><stop offset="1" stop-color="#7213EA"/></linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bgBlue)"/>
<g id="content">
<text x="80" y="120" font-family="'KPMG Bold','KPMG','Arial Narrow','Oswald','Helvetica Neue Condensed',Arial,sans-serif" font-size="64" font-weight="bold" fill="#FFFFFF" text-anchor="start" ><tspan x="80" dy="0.0">Opportunity pipeline</tspan></text>
<text x="80" y="168" font-family="Arial,'Helvetica Neue',sans-serif" font-size="24" font-weight="normal" fill="#ACEAFF" text-anchor="start" ><tspan x="80" dy="0.0">Pipeline health by stage</tspan></text>
